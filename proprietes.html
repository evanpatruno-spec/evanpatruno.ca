    <style>
        :root {
            --bg-dark: #0f050d;
            --bg-card: rgba(255, 255, 255, 0.03);
            --accent-pink: #ff007f;
            --accent-purple: #873276;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-glow: 0 0 20px rgba(135, 50, 118, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* HEADER / HERO */
        .listing-hero {
            padding: 40px 20px 40px;
            text-align: center;
            background: radial-gradient(circle at top, rgba(135, 50, 118, 0.15), transparent 70%);
            position: relative;
        }

        .listing-hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -2px;
            background: linear-gradient(to right, #ffffff, #ffb8e6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .listing-hero p {
            font-size: 1.2rem;
            color: var(--text-dim);
            max-width: 700px;
            margin: 0 auto;
        }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        .filter-btn {
            padding: 10px 22px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn:hover {
            border-color: var(--accent-purple);
            color: #fff;
        }

        .filter-btn.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 20px rgba(135, 50, 118, 0.3);
        }

        /* GRID */
        .listing-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 35px;
        }

        /* PROPERTY CARD */
        .prop-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .prop-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-purple);
            box-shadow: var(--neon-glow);
        }

        /* IMAGE WRAPPER */
        .prop-image-wrap {
            height: 280px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .prop-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .prop-card:hover .prop-image-wrap img {
            transform: scale(1.1);
        }

        /* BADGES */
        .badge {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .badge-sale {
            background: rgba(255, 255, 255, 0.9);
            color: var(--bg-dark);
        }

        .badge-rent {
            background: var(--accent-purple);
            color: white;
        }

        .badge-sold {
            background: linear-gradient(135deg, #d4af37, #b5952f);
            color: #1e0a19;
            top: auto;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* CONTENT */
        .prop-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .prop-price {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
        }

        .prop-city {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prop-divider {
            height: 1px;
            background: var(--glass-border);
            margin-top: auto;
            margin-bottom: 20px;
        }

        .prop-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prop-mls {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
        }

        .prop-btn {
            padding: 12px 24px;
            background: var(--accent-purple);
            color: white;
            text-decoration: none;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .prop-btn:hover {
            background: transparent;
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(135, 50, 118, 0.4);
        }

        /* SOLD OVERLAY */
        .prop-sold-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 5, 13, 0.6);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .is-sold .prop-sold-overlay {
            opacity: 1;
        }

        .is-sold .prop-btn {
            background: #333;
            pointer-events: none;
            color: #666;
        }

        /* LOADING */
        .loading-state {
            grid-column: 1 / -1;
            padding: 100px 0;
            text-align: center;
            color: var(--text-dim);
            font-size: 1.5rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .properties-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .listing-hero {
                padding: 80px 20px 40px;
            }

            .listing-hero h1 {
                font-size: 2.2rem;
            }

            .prop-card {
                border-radius: 24px;
            }
        }
    </style>
</head>

    </style>

    <script>
        const BIN_ID = "694462e7d0ea881f4032d140";
        let allProperties = [];
        let currentPhotos = [];
        let photoIdx = 0;

        const FALLBACK_IMG = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&q=80&w=800";

        async function fetchAndRender(filter = 'all') {
            const grid = document.getElementById('properties-grid');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
                const data = await res.json();
                allProperties = data.record;

                let filtered = allProperties.map(p => {
                    const isSold = p.isSold || false;
                    const isRent = (p.price || "").toLowerCase().includes('/mois') || 
                                   (p.price || "").toLowerCase().includes('louer') || 
                                   (p.price || "").toLowerCase().includes('/pc') || 
                                   (p.price || "").toLowerCase().includes('/an');
                    let category = "residentiel";
                    const d = (p.description || "").toLowerCase();
                    if (d.includes('commercial') || d.includes('local')) category = "commercial";
                    if (d.includes('industriel')) category = "industriel";
                    return { ...p, isSold, isRent, category };
                });

                if (filter === 'vendre') filtered = filtered.filter(p => !p.isRent);
                else if (filter === 'louer') filtered = filtered.filter(p => p.isRent);
                else if (filter !== 'all') filtered = filtered.filter(p => p.category === filter);
                filtered.sort((a, b) => (a.isSold === b.isSold) ? 0 : a.isSold ? 1 : -1);

                grid.innerHTML = '';
                filtered.forEach((p) => {
                    const card = document.createElement('div');
                    card.className = `prop-card ${p.isSold ? 'is-sold' : ''}`;
                    card.innerHTML = `
                        <div class="prop-image-wrap">
                            ${p.isSold ? '<div class="badge badge-sold">VENDU</div>' : `<div class="badge ${p.isRent ? 'badge-rent' : 'badge-sale'}">${p.isRent ? 'À LOUER' : 'À VENDRE'}</div>`}
                            <img src="${p.image}" alt="${p.city}" onerror="this.src='${FALLBACK_IMG}'" loading="lazy">
                        </div>
                        <div class="prop-content">
                            <div class="prop-price">${p.price}</div>
                            <div class="prop-city">${p.city}</div>
                            <div class="prop-divider"></div>
                            <div class="prop-footer">
                                <span class="prop-mls"># ${p.mls}</span>
                                <button class="prop-btn btn-details" data-mls="${p.mls}">
                                    ${p.isSold ? 'Voir Vendu' : 'Détails →'}
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) { grid.innerHTML = '<div class="loading-state">Erreur de chargement. Veuillez rafraîchir.</div>'; }
        }

        // DELEGATED EVENT LISTENER
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.btn-details');
            if (btn) {
                const mls = btn.getAttribute('data-mls');
                openDetails(mls);
            }
        });

        function formatMoney(val) {
            if (!val) return '';
            const cleaned = String(val).replace(/[^0-9]/g, '');
            if (!cleaned) return String(val);
            const num = parseInt(cleaned, 10);
            return num.toLocaleString('fr-CA') + ' $';
        }

        function parseMoney(val) {
            if (!val) return 0;
            const cleaned = String(val).replace(/[^0-9]/g, '');
            return cleaned ? parseInt(cleaned, 10) : 0;
        }

        function renderModalSpecs(specs) {
            if (!specs || Object.keys(specs).length === 0) {
                return '<div style="opacity:0.5;font-style:italic;padding:15px 0;">Aucune caractéristique technique enregistrée.</div>';
            }

            // 1. Key Metrics
            const bldType = specs["Type de bâtiment"] || specs["Genre de propriété"] || "";
            const units = specs["Nombre d'unités au total"] ? specs["Nombre d'unités au total"] + " unité(s)" : (specs["Nombre de chambres"] ? specs["Nombre de chambres"] + " ch." : "");
            const year = specs["Année de construction"] || "";
            const landSize = specs["Superficie du terrain"] || specs["Aire au sol"] || specs["Superficie habitable"] || "";
            const zoning = specs["Zonage"] || specs["Type de commerce/Industrie"] || "";

            // 2. Financials
            const taxMuniRaw = specs["Taxes municipales"] || "";
            const taxScolRaw = specs["Taxes scolaires"] || "";
            const evalTerrainRaw = specs["Évaluation municipale du terrain"] || "";
            const evalBatimentRaw = specs["Évaluation municipale du bâtiment"] || "";
            const evalYear = specs["Année d'évaluation"] || "";

            const taxMuniNum = parseMoney(taxMuniRaw);
            const taxScolNum = parseMoney(taxScolRaw);
            const totalTaxNum = taxMuniNum + taxScolNum;

            const evalTerrainNum = parseMoney(evalTerrainRaw);
            const evalBatimentNum = parseMoney(evalBatimentRaw);
            const totalEvalNum = evalTerrainNum + evalBatimentNum;

            const hasFinancials = taxMuniNum > 0 || taxScolNum > 0 || totalEvalNum > 0;

            // 3. Tags (Commerce, Particularités, Proximité)
            const rawCommerce = specs["Genre de commerce"] || "";
            const commerceTags = rawCommerce ? rawCommerce.split(',').map(s => s.trim()).filter(Boolean) : [];

            const rawParticularites = specs["Particularités"] || "";
            const particulariteTags = rawParticularites ? rawParticularites.split(',').map(s => s.trim()).filter(Boolean) : [];

            const rawProximite = specs["Proximité"] || "";
            const proximiteTags = rawProximite ? rawProximite.split(',').map(s => s.trim()).filter(Boolean) : [];

            // 4. Infrastructure & Equipment
            const eau = specs["Approvisionnement en eau"] || "";
            const egouts = specs["Système d'égouts"] || "";
            const chauffage = specs["Énergie pour le chauffage"] || specs["Mode de chauffage"] || "";
            const stationnement = specs["Stationnement (total)"] || specs["Garage"] || "";

            // 5. Remaining Specs
            const handledKeys = [
                "Type de bâtiment", "Genre de propriété", "Nombre d'unités au total", "Nombre d'étages",
                "Année de construction", "Superficie du terrain", "Aire au sol", "Superficie habitable", "Zonage", "Type de commerce/Industrie",
                "Taxes municipales", "Taxes scolaires", "Évaluation municipale du terrain", "Évaluation municipale du bâtiment", "Année d'évaluation", "Reprise de finance",
                "Genre de commerce", "Particularités", "Proximité", "Approvisionnement en eau", "Système d'égouts", "Énergie pour le chauffage", "Mode de chauffage",
                "Stationnement (total)", "Garage", "Nombre de chambres", "Nombre de pièces", "Nombre de salles de bain"
            ];

            const otherSpecs = Object.entries(specs).filter(([k, v]) => !handledKeys.includes(k) && !k.includes('Pièces') && !k.includes('Dimensions'));

            let html = '';

            // --- SECTION 1: KEY METRICS CARDS ---
            html += '<div class="specs-hero-grid">';
            if (bldType || units) {
                html += `<div class="spec-hero-card">
                    <span class="hero-card-icon">🏢</span>
                    <div class="hero-card-info">
                        <span class="hero-card-label">Bâtiment / Unités</span>
                        <strong class="hero-card-val">${bldType}${units ? ' • ' + units : ''}</strong>
                    </div>
                </div>`;
            }
            if (year) {
                html += `<div class="spec-hero-card">
                    <span class="hero-card-icon">📅</span>
                    <div class="hero-card-info">
                        <span class="hero-card-label">Année de construction</span>
                        <strong class="hero-card-val">${year}</strong>
                    </div>
                </div>`;
            }
            if (landSize) {
                html += `<div class="spec-hero-card">
                    <span class="hero-card-icon">📐</span>
                    <div class="hero-card-info">
                        <span class="hero-card-label">Superficie du terrain</span>
                        <strong class="hero-card-val">${landSize}</strong>
                    </div>
                </div>`;
            }
            if (zoning) {
                html += `<div class="spec-hero-card">
                    <span class="hero-card-icon">🏷️</span>
                    <div class="hero-card-info">
                        <span class="hero-card-label">Zonage & Usage</span>
                        <strong class="hero-card-val">${zoning}</strong>
                    </div>
                </div>`;
            }
            html += '</div>';

            // --- SECTION 2: FINANCIAL SUMMARY ---
            if (hasFinancials) {
                html += `
                <div class="specs-financial-block">
                    <div class="financial-header">
                        <span class="fin-title">📊 Sommaire Financier & Évaluation</span>
                        ${evalYear ? `<span class="fin-year-badge">Rôle ${evalYear}</span>` : ''}
                    </div>
                    <div class="financial-grid">
                        <div class="fin-col">
                            <div class="fin-subhead">Taxes Annuelles</div>
                            ${taxMuniNum ? `<div class="fin-row"><span>Taxes municipales :</span><strong>${formatMoney(taxMuniNum)}</strong></div>` : ''}
                            ${taxScolNum ? `<div class="fin-row"><span>Taxe scolaire :</span><strong>${formatMoney(taxScolNum)}</strong></div>` : ''}
                            ${totalTaxNum ? `<div class="fin-row fin-total"><span>Total taxes :</span><strong class="tax-total-badge">${formatMoney(totalTaxNum)} / an</strong></div>` : ''}
                        </div>
                        <div class="fin-col">
                            <div class="fin-subhead">Évaluation Municipale</div>
                            ${evalTerrainNum ? `<div class="fin-row"><span>Terrain :</span><strong>${formatMoney(evalTerrainNum)}</strong></div>` : ''}
                            ${evalBatimentNum ? `<div class="fin-row"><span>Bâtiment :</span><strong>${formatMoney(evalBatimentNum)}</strong></div>` : ''}
                            ${totalEvalNum ? `<div class="fin-row fin-total"><span>Évaluation totale :</span><strong class="eval-total-badge">${formatMoney(totalEvalNum)}</strong></div>` : ''}
                        </div>
                    </div>
                </div>`;
            }

            // --- SECTION 3: COMMERCIAL ACTIVITIES ---
            if (commerceTags.length > 0) {
                html += `
                <div class="specs-tags-block">
                    <div class="tags-title">💼 Activités & Vocation Commerciale</div>
                    <div class="tags-list">
                        ${commerceTags.map(t => `<span class="spec-tag commerce-tag">${t}</span>`).join('')}
                    </div>
                </div>`;
            }

            // --- SECTION 4: HIGHLIGHTS & PROXIMITY ---
            if (particulariteTags.length > 0 || proximiteTags.length > 0) {
                html += `<div class="specs-highlights-grid">`;
                if (particulariteTags.length > 0) {
                    html += `
                    <div class="highlight-box">
                        <div class="box-title">🌊 Atouts & Particularités</div>
                        <div class="tags-list">
                            ${particulariteTags.map(t => `<span class="spec-tag feature-tag">${t}</span>`).join('')}
                        </div>
                    </div>`;
                }
                if (proximiteTags.length > 0) {
                    html += `
                    <div class="highlight-box">
                        <div class="box-title">📍 Proximité & Loisirs</div>
                        <div class="tags-list">
                            ${proximiteTags.map(t => `<span class="spec-tag location-tag">${t}</span>`).join('')}
                        </div>
                    </div>`;
                }
                html += `</div>`;
            }

            // --- SECTION 5: INFRASTRUCTURE ---
            if (eau || egouts || chauffage || stationnement) {
                html += `
                <div class="specs-infra-block">
                    <div class="infra-title">🛠️ Services & Infrastructures</div>
                    <div class="infra-grid">
                        ${eau ? `<div class="infra-item"><span class="infra-k">Approvisionnement en eau :</span><strong class="infra-v">${eau}</strong></div>` : ''}
                        ${egouts ? `<div class="infra-item"><span class="infra-k">Système d'égouts :</span><strong class="infra-v">${egouts}</strong></div>` : ''}
                        ${chauffage ? `<div class="infra-item"><span class="infra-k">Chauffage & Énergie :</span><strong class="infra-v">${chauffage}</strong></div>` : ''}
                        ${stationnement ? `<div class="infra-item"><span class="infra-k">Stationnement / Garage :</span><strong class="infra-v">${stationnement}</strong></div>` : ''}
                    </div>
                </div>`;
            }

            // --- SECTION 6: OTHER SPECS ---
            if (otherSpecs.length > 0) {
                html += `
                <div class="specs-others-block">
                    <div class="others-title">📋 Autres Caractéristiques</div>
                    <div class="others-grid">
                        ${otherSpecs.map(([k, v]) => `
                            <div class="other-item">
                                <span class="other-k">${k}</span>
                                <strong class="other-v">${v}</strong>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            return html;
        }

        function openDetails(mls) {
            const p = allProperties.find(item => item.mls == mls);
            if (!p) return;

            document.getElementById('modal-title').textContent = p.city;
            document.getElementById('modal-price').textContent = p.price;
            let brokerDisplay = p.brokers || "Evan Patruno";
            if (brokerDisplay.split(',').length > 3) {
                brokerDisplay = brokerDisplay.split(',')[0].trim();
            }
            document.getElementById('modal-brokers').innerHTML = `<span style="opacity:0.6;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;">Courtier(s) Inscription :</span><br><b style="font-size:1.1rem;color:#fff;">${brokerDisplay}</b>`;
            document.getElementById('modal-desc').textContent = p.description;
            document.getElementById('modal-link').href = p.url;

            // CONTACT BUTTON AUTOMATION
            const contactBtn = document.getElementById('contact-btn');
            const subject = encodeURIComponent(`Demande de visite : ${p.city} (MLS #${p.mls})`);
            const body = encodeURIComponent(`Bonjour Evan,\n\nJe suis intéressé par la propriété située à ${p.city} (MLS #${p.mls}).\n\nPourriez-vous me recontacter pour planifier une visite ou me donner plus d'informations ?\n\nMerci !`);
            contactBtn.href = `mailto:info@evanpatruno.ca?subject=${subject}&body=${body}`;

            document.getElementById('modal-specs').innerHTML = renderModalSpecs(p.specs);

            currentPhotos = p.photos && p.photos.length ? p.photos : [p.image || FALLBACK_IMG];
            photoIdx = 0;
            updateGallery();

            const modal = document.getElementById('prop-modal');
            modal.style.display = 'flex'; // Use flex for center
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function updateGallery() {
            const img = document.getElementById('modal-img');
            img.onerror = () => { img.src = FALLBACK_IMG; };
            img.src = currentPhotos[photoIdx] || FALLBACK_IMG;
            document.getElementById('photo-counter').textContent = `${photoIdx + 1} / ${currentPhotos.length}`;
        }

        document.getElementById('prevBtn').onclick = (e) => { e.stopPropagation(); photoIdx = (photoIdx > 0) ? photoIdx - 1 : currentPhotos.length - 1; updateGallery(); };
        document.getElementById('nextBtn').onclick = (e) => { e.stopPropagation(); photoIdx = (photoIdx < currentPhotos.length - 1) ? photoIdx + 1 : 0; updateGallery(); };

        function closeModal() {
            const modal = document.getElementById('prop-modal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 400);
        }

        document.getElementById('closeModal').onclick = closeModal;
        window.onclick = (event) => { if (event.target == document.getElementById('prop-modal')) closeModal(); };

        document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            fetchAndRender(this.getAttribute('data-filter'));
        }));

        // INITIAL LOAD
        fetchAndRender('all');
    </script>
</body>

</html>
