name: Daily Centris & News Scraper

on:
  schedule:
    # S'exécute tous les jours à 13h00 UTC (8h00 EST / 9h00 EDT)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions

concurrency:
  group: repo-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml jinja2

      - name: Run Scrapers (Centris, News & BOC)
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          python centris_scraper.py
          python news_scraper.py
          python boc_monitor.py

      - name: Upload BOC Rates Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boc-rates-data
          path: boc_rates.json
          retention-days: 5

      - name: Commit and Push updated JSON files
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add news.json properties.json boc_rates.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated data update [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
