name: Approve and Publish Newsletter

on:
  workflow_dispatch: # Déclenchement manuel par Evan après vérification du courriel d'aperçu

concurrency:
  group: repo-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jinja2

      - name: Trigger Zoho Final Publication
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          ZOHO_WEBHOOK_URL: ${{ secrets.ZOHO_WEBHOOK_URL }}
        run: |
          python newsletter_generator.py --force

      - name: Record Approval State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add newsletter_ready.json newsletter_bin_id.txt
          if ! git diff --cached --quiet; then
            git commit -m "Approve monthly newsletter [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
