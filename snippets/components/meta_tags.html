<script>
    // READING PROGRESS BAR INITIALIZATION
    (function () {
        function initProgress() {
            if (!document.body || document.getElementById('ep-reading-progress')) return;
            const bar = document.createElement('div');
            bar.id = 'ep-reading-progress';
            document.body.prepend(bar);
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
                bar.style.width = scrolled + "%";
            });
        }
        if (document.body) {
            initProgress();
        } else {
            document.addEventListener('DOMContentLoaded', initProgress);
        }
    })();

<script>
    // GLOBAL MOTION & SCROLL ANIMATION ENGINE (Scroll Reveal, Stagger, Count-Up, Sticky Header)
    (function () {
        function initMotionEngine() {
            // 1. Sticky Glass Header on Scroll
            const header = document.querySelector('.theme-header');
            if (header) {
                const onScrollHeader = () => {
                    if (window.scrollY > 60) header.classList.add('ep-header-scrolled');
                    else header.classList.remove('ep-header-scrolled');
                };
                window.addEventListener('scroll', onScrollHeader, { passive: true });
                onScrollHeader();
            }

            // 2. Categorized selectors for directional scroll reveal
            const upSelectors = [
                'section h2',
                'section .section-subtitle',
                '.cat-header',
                '.rev-header',
                '.market-dashboard',
                '.baro-header',
                '.glossary-section > div > h2',
                '.infographic-section h2'
            ];
            const leftSelectors = [
                '.about-photo-card',
                '.evaluation-info',
                '.alert-info',
                '.finance-info',
                '.prequal-info',
                '.renewal-info',
                '.commercial-info',
                '.investor-info',
                '.hero-photo-container'
            ];
            const rightSelectors = [
                '.about-card',
                '.evaluation-form-card',
                '.alert-form-card',
                '.finance-form-card',
                '.prequal-form-card',
                '.renewal-form-card',
                '.commercial-form-card',
                '.investor-form-card',
                '.contact-form-card',
                '.hero-text-side'
            ];
            const scaleSelectors = [
                '.ready-cta-section',
                '.guide-magnet',
                '.about-vip-cta',
                '.booking-card',
                '.amb-form-card',
                '.compliance-trust-section'
            ];
            const staggerContainers = [
                { parent: '.services-grid', child: '.service-card' },
                { parent: '.hub-grid', child: '.hub-card' },
                { parent: '.process-grid', child: '.process-step' },
                { parent: '.values-grid', child: '.value-card' },
                { parent: '.expertise-grid', child: '.expertise-item' },
                { parent: '.network-grid', child: '.partner-type-card' },
                { parent: '.about-stats-strip', child: '.about-stat-box' },
                { parent: '.geo-grid', child: '.geo-card' },
                { parent: '.glossary-grid', child: '.glossary-card' },
                { parent: '.checklist-grid', child: '.checklist-box' },
                { parent: '.resources-grid', child: '.resource-card' },
                { parent: '.amb-pillars', child: '.pillar-card' },
                { parent: '.contact-grid', child: '.info-card' },
                { parent: '.rev-track-container', child: '.rev-card' },
                { parent: '.faq-container, .faq-list', child: '.faq-item' }
            ];

            const observedElements = new Set();

            function registerAnim(el, variantClass, delayMs) {
                if (!el || observedElements.has(el)) return;
                // Do not hide elements inside modals
                if (el.closest('.modal-overlay')) return;
                el.classList.add('ep-anim', variantClass);
                if (delayMs) el.style.setProperty('--ep-delay', delayMs + 'ms');
                observedElements.add(el);
            }

            // Register staggered grids first so their children get cascade delays
            staggerContainers.forEach(({ parent, child }) => {
                document.querySelectorAll(parent).forEach(grid => {
                    const items = grid.querySelectorAll(child);
                    items.forEach((item, idx) => {
                        const colDelay = (idx % 4) * 95;
                        registerAnim(item, 'ep-anim-up', colDelay);
                    });
                });
            });

            // Register Left / Right split columns
            document.querySelectorAll(leftSelectors.join(',')).forEach(el => registerAnim(el, 'ep-anim-left', 0));
            document.querySelectorAll(rightSelectors.join(',')).forEach(el => registerAnim(el, 'ep-anim-right', 90));

            // Register Scale CTA blocks
            document.querySelectorAll(scaleSelectors.join(',')).forEach(el => registerAnim(el, 'ep-anim-scale', 0));

            // Register Headings & Section titles
            document.querySelectorAll(upSelectors.join(',')).forEach(el => registerAnim(el, 'ep-anim-up', 0));

            // Create IntersectionObserver for Scroll Reveal
            if ('IntersectionObserver' in window) {
                const revealObs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('ep-in-view');
                            revealObs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: '0px 0px -35px 0px' });

                observedElements.forEach(el => revealObs.observe(el));
            } else {
                observedElements.forEach(el => el.classList.add('ep-in-view'));
            }

            // Safety fallback: if an element is already above the fold, reveal it immediately
            setTimeout(() => {
                observedElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight * 0.92) {
                        el.classList.add('ep-in-view');
                    }
                });
            }, 120);

            // 3. Animated Number Counters (Count-Up on Scroll)
            const counterEls = document.querySelectorAll('.about-stat-num, .stat-number, [data-count-up]');
            if (counterEls.length && 'IntersectionObserver' in window) {
                const countObs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        const el = entry.target;
                        countObs.unobserve(el);
                        const raw = (el.getAttribute('data-target') || el.textContent || '').trim();
                        const match = raw.match(/^([^0-9]*)([0-9]+(?:[.,][0-9]+)?)(.*)$/);
                        if (!match) return;
                        const prefix = match[1] || '';
                        const targetNum = parseFloat(match[2].replace(',', '.'));
                        const suffix = match[3] || (el.classList.contains('stat-number') ? (targetNum > 90 && targetNum < 100 ? '%' : '+') : '');
                        const isFloat = match[2].includes('.') || match[2].includes(',');
                        const duration = 1650;
                        const startTime = performance.now();

                        function tick(now) {
                            const progress = Math.min((now - startTime) / duration, 1);
                            // easeOutQuart
                            const eased = 1 - Math.pow(1 - progress, 4);
                            const current = targetNum * eased;
                            const formatted = isFloat ? current.toFixed(1) : Math.round(current).toString();
                            el.textContent = prefix + formatted + suffix;
                            if (progress < 1) {
                                requestAnimationFrame(tick);
                            } else {
                                el.textContent = prefix + match[2] + suffix;
                            }
                        }
                        requestAnimationFrame(tick);
                    });
                }, { threshold: 0.35 });

                counterEls.forEach(el => countObs.observe(el));
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMotionEngine);
        } else {
            initMotionEngine();
        }
    })();
</script>
