<style>
    /* 4. AVIS GOOGLE V3 — ÉPURÉ (SEULEMENT LES AVIS) */
    .rev-section {
        padding: 45px 20px;
        background: transparent;
        font-family: 'Outfit', sans-serif;
        overflow: visible;
    }
    .rev-section * { box-sizing: border-box; }
    .rev-container { max-width: 1200px; margin: 0 auto; position: relative; padding: 0 54px; }

    .rev-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 46px;
        height: 46px;
        background: rgba(43, 11, 36, 0.85);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 50%;
        color: #d4af37;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: all 0.25s ease;
        backdrop-filter: blur(10px);
        font-size: 1.35rem;
        user-select: none;
    }
    .rev-nav:hover { background: #873276; color: #ffffff; border-color: #ffffff; transform: translateY(-50%) scale(1.08); }
    .rev-prev { left: 0; }
    .rev-next { right: 0; }

    .rev-track-container {
        display: flex;
        gap: 24px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 16px 24px 24px;
        scrollbar-width: none;
        scroll-padding: 24px;
        align-items: stretch;
    }
    .rev-track-container::-webkit-scrollbar { display: none; }

    .rev-card {
        flex: 0 0 355px;
        scroll-snap-align: center;
        background: rgba(43, 11, 36, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 26px;
        padding: 32px 28px;
        position: relative;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 260px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .rev-card:hover {
        border-color: rgba(212, 175, 55, 0.4);
        background: rgba(43, 11, 36, 0.88);
        transform: translateY(-6px);
    }

    .rev-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }
    .rev-stars {
        color: #d4af37;
        font-size: 1.05rem;
        letter-spacing: 2px;
    }

    .rev-text-wrap {
        flex: 1;
        margin-bottom: 22px;
    }
    .rev-text {
        color: rgba(255, 255, 255, 0.86);
        font-size: 0.96rem;
        line-height: 1.65;
        margin: 0;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .rev-card.expanded .rev-text {
        display: block;
        -webkit-line-clamp: unset;
    }
    .rev-readmore {
        background: none;
        border: none;
        color: #d4af37;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 6px 0 0;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        display: inline-block;
    }

    .rev-footer {
        display: flex;
        align-items: center;
        gap: 13px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        padding-top: 18px;
    }
    .rev-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, #d4af37, #873276);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.98rem;
        color: #ffffff;
        flex-shrink: 0;
        overflow: hidden;
        border: 1px solid rgba(212, 175, 55, 0.35);
    }
    .rev-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .rev-info h4 {
        color: #ffffff;
        margin: 0;
        font-size: 0.98rem;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .rev-section { padding: 32px 8px !important; }
        .rev-container { padding: 0 6px !important; }
        .rev-track-container { gap: 14px; padding: 10px 12px 20px; scroll-padding: 12px; }
        .rev-card { flex: 0 0 calc(100vw - 54px); padding: 24px 20px; min-height: 240px; }
        .rev-nav { display: none; }
    }
</style>

<section class="rev-section reveal" id="reviews">
    <div class="rev-container">
        <div class="rev-nav rev-prev" onclick="scrollReviews(-1)" aria-label="Avis précédent">‹</div>
        <div class="rev-nav rev-next" onclick="scrollReviews(1)" aria-label="Avis suivant">›</div>

        <div class="rev-track-container" id="revTrack"></div>
    </div>
</section>

<script>

                text: "J’ai eu le plaisir de collaborer avec Evan pour des clients que je lui avais référés et l’expérience a été excellente ! Il a su les accompagner avec beaucoup d’attention, de disponibilité et de professionnalisme tout au long du processus. Une très belle collaboration et surtout un excellent travail."
            },
            {
                name: "Véronique Mongeau",
                avatar: "https://lh3.googleusercontent.com/a/ACg8ocLa31RClPtEBup3uK6z9EJkx8toWioKRZWdUKRTExFLuTsM=w72-h72-p-rp-mo-ba12-br100",
                text: "Excellent courtier ! Evan a été disponible, honnête et efficace du début à la fin. Il a su trouver exactement ce qu'il fallait pour nous. Je recommande à 100 %."
            },
            {
                name: "Cynthia Garcia",
                avatar: "https://lh3.googleusercontent.com/a-/ALV-UjV-EV0mZHiQJaVE7XkQZTCnjsAtugU0UY9mPJw6tsXgD0SWGcsp=w72-h72-p-rp-mo-br100",
                text: "Je tiens à partager mon excellente expérience avec le service offert par Evan. Dès le premier contact, j’ai été impressionnée par sa connaissance du marché, son professionnalisme, son écoute et sa disponibilité. Il a su bien comprendre mes besoins et m’accompagner à chaque étape avec des conseils clairs et judicieux."
            },
            {
                name: "Elisa Desoer",
                avatar: "https://lh3.googleusercontent.com/a-/ALV-UjVSoTJN-ZAItAKyKiHrIwgPHvty2WrO9cBR3u1j7xBFJnErbwo=w72-h72-p-rp-mo-br100",
                text: "Evan m’a bien accompagnée deux fois pour des achats immobiliers et aussi pour ma vente de condo. Il est très réactif, rigoureux, à l’écoute et ne met pas de pression lorsqu’il sent des hésitations de notre côté. On sent qu’il défend nos intérêts et c’est une qualité précieuse pour un courtier !"
            },
            {
                name: "V N",
                avatar: "https://lh3.googleusercontent.com/a/ACg8ocJBeevuk9sWIOXNxB3pVC01L6uKkJuf0j3e3pvsYc93DoaOA7U=w72-h72-p-rp-mo-ba12-br100",
                text: "Le meilleur ! Evan est un courtier super professionnel, toujours disponible et vraiment à l’écoute. Il rend le processus simple et sans stress, tout en donnant de bons conseils honnêtes. Tu sens qu’il veut vraiment le meilleur pour toi, pas juste conclure une vente. Je le recommande sans hésiter !"
            },
            {
                name: "Pierre-Antoine Jacques",
                avatar: "",
                text: "Nous avons transigé avec Evan pour l'achat de notre première maison. Il s'est montré d'une grande gentillesse, d'une efficacité et d'une rapidité exemplaire pour répondre à nos questions."

            {

                avatar: "",
                text: "Excellente expérience avec Evan ! Disponible, réactif et très à l'écoute, il a su rendre la vente de ma maison simple et sereine. Son professionnalisme et ses précieux conseils m'ont beaucoup aidé."
            },
            {
                name: "Michaël P.",
                avatar: "",
                text: "Nous avons eu la chance d'être accompagnés par Evan, un courtier exceptionnel, pendant plus de deux ans dans notre recherche de la maison idéale. Ce professionnel a travaillé sans relâche."

            {
                name: "Marie-Ève Dupont",
                avatar: "",

            },
            {
                name: "Jordan Hebert",
                avatar: "",
                text: "Tu veux vendre ou acheter un building commercial ou un multi-logement, tu dois considérer faire affaire avec Evan pour son professionnalisme et l'amour qu'il met dans son travail."
            },
            {

                avatar: "",
                text: "Evan est toujours là pour répondre rapidement à nos questions. Toujours disponible pour venir visiter et faire des démarches même si le temps presse. Je recommande absolument."
            },
            {
                name: "Samuel Beausoleil",
                avatar: "",
                text: "Evan prend le temps de nous informer des nouveautés sur le marché qui pourraient répondre à nos besoins. Il s'occupe de toute la logistique et répond rapidement aux interrogations."
            },
            {
                name: "Mélanie Laganière",
                avatar: "",
                text: "Je vous recommande Evan pour vous aider avec votre future transaction immobilière ! Il saura vous mettre à l'aise, il est professionnel, disponible et très ponctuel."
            }
        ];

        function renderGoogleReviews(list) {
            const track = document.getElementById('revTrack');
            if (!track) return;
            track.innerHTML = '';
            list.forEach((rev) => {
                const initial = (rev.name || 'C').trim().charAt(0).toUpperCase();
                const isLong = (rev.text || '').length > 185;
                const card = document.createElement('div');
                card.className = 'rev-card';
                const avatarHtml = rev.avatar
                    ? '<img src="' + rev.avatar + '" alt="' + rev.name.replace(/"/g, '') + '" loading="lazy" onerror="this.parentNode.textContent=\'' + initial + '\'">'
                    : initial;
                card.innerHTML =
                    '<div>' +
                        '<div class="rev-card-top">' +
                            '<div class="rev-stars">★★★★★</div>' +
                        '</div>' +
                        '<div class="rev-text-wrap">' +
                            '<p class="rev-text">« ' + rev.text + ' »</p>' +
                            (isLong ? '<button type="button" class="rev-readmore" onclick="const c=this.closest(\'.rev-card\');c.classList.toggle(\'expanded\');this.textContent=c.classList.contains(\'expanded\')?\'Réduire\':\'Lire la suite\';">Lire la suite</button>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="rev-footer">' +
                        '<div class="rev-avatar">' + avatarHtml + '</div>' +
                        '<div class="rev-info"><h4>' + rev.name + '</h4></div>' +
                    '</div>';
                track.appendChild(card);
            });
            const spacer = document.createElement('div');
            spacer.style.cssText = 'flex: 0 0 16px; width: 16px; height: 1px; visibility: hidden;';
            track.appendChild(spacer);
        }

        renderGoogleReviews(INITIAL_GOOGLE_REVIEWS);

        // Synchronisation dynamique avec l'API Vercel (/api/google-reviews)
        fetch('https://dossier.evanpatruno.ca/api/google-reviews')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (data && Array.isArray(data.reviews) && data.reviews.length > 0) {
                    renderGoogleReviews(data.reviews);
                }
            })
            .catch(() => {});
    })();

    function scrollReviews(direction) {
        const track = document.getElementById('revTrack');
        if (!track) return;
        const scrollAmount = track.offsetWidth > 768 ? 380 : track.offsetWidth;
        track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }
</script>
